<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifestation Gallery</title>
    <style>
		.audio-modal {
  position: fixed;
  inset: 0;

  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0, 0, 0, 0.35);

  backdrop-filter: blur(8px);
}

.audio-modal-box {
  width: min(360px, 85vw);

  padding: 32px;

  border-radius: 20px;

  background: white;

  text-align: center;

  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
}

.audio-modal-title {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 8px;
}

.audio-modal-text {
  font-size: 14px;
  opacity: 0.55;
  margin-bottom: 24px;
}

#enter-gallery {
  border: none;

  padding: 11px 20px;

  border-radius: 999px;

  background: #111;
  color: white;

  font-size: 13px;

  cursor: pointer;
}

#enter-gallery:hover {
  opacity: 0.8;
}

.audio-modal.hidden {
  display: none;
}
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f7f5f2;
        color: #242321;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          Helvetica, Arial, sans-serif;
      }

      header {
        padding: 42px 5vw 28px;
        text-align: center;
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 58px);
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.55;
      }

      .gallery {
        width: min(1500px, 94vw);
        height: calc(100vh - 145px);
        margin: 10px auto 20px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 12px;
        overflow: hidden;
      }

      .card {
        min-height: 0;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: #e9e5df;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.10);
      }

      .image-wrapper {
        z-index: 0;
        position: absolute;
        inset: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e9e5df;
      }

      .card-image {
        display: block;
      }

      /* Same image, enlarged and Gaussian-blurred to fill the card background. */
      .card-image-blur {
        position: absolute;
        inset: -30px;
        width: calc(100% + 60px);
        height: calc(100% + 60px);
        object-fit: cover;
        filter: blur(25px);
        opacity: 0.85;
        z-index: 1;
      }

      /* Sharp version: the entire image stays visible without cropping. */
      .card-image-sharp {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 2;
      }

      .image-card {
        min-height: 0;
      }

      .image-card .card-content {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 14px;
        background: linear-gradient(transparent,
            rgba(0, 0, 0, 0.65));
        color: white;
        z-index: 3;
      }

      .card-content {
        padding: 14px;
      }

      .card-title {
        font-size: 15px;
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .card-tag {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 7px;
        border: 1px solid currentColor;
        border-radius: 999px;
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      .text-card {
        min-height: 0;
      }

      .text-card .card-title {
        font-size: 16px;
      }

      .footer {
        display: none;
      }

      @media (max-width: 900px) {
        .gallery {
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: repeat(5, 1fr);
          height: calc(100vh - 120px);
          gap: 8px;
        }

        .card-title {
          font-size: 13px;
        }

        .text-card .card-title {
          font-size: 14px;
        }

        .card-content {
          padding: 10px;
        }
      }

      @media (max-width: 600px) {
        header {
          padding-top: 30px;
        }

        .gallery {
          columns: 2 150px;
          width: 94vw;
          gap: 10px;
        }

        .card {
          margin-bottom: 10px;
          border-radius: 13px;
        }

        .card-content {
          padding: 16px;
        }

        .card-title {
          font-size: 14px;
        }

        .text-card .card-title {
          font-size: 20px;
        }
      }

      .disguise-toggle {
        position: fixed;
        top: 18px;
        right: 20px;
        width: 30px;
        height: 30px;
        border: none;
        background: transparent;
        font-size: 14px;
        letter-spacing: 2px;
        opacity: 0.25;
        cursor: pointer;
        z-index: 100;
      }

      .disguise-toggle:hover {
        opacity: 0.6;
      }

      /* Disguise mode */
      /* Disguise mode */
      body.disguise-mode .card-title,
      body.disguise-mode .card-tag {
        filter: blur(12px);
        user-select: none;
      }

      /* Blur/hide imagery in disguise mode. */
      body.disguise-mode .card-image-sharp {
        visibility: hidden;
      }

      body.disguise-mode .card-image-blur {
        filter: blur(38px);
        transform: scale(1.08);
        opacity: 1;
      }

      /* Blur the text overlay as well */
      body.disguise-mode .image-card .card-content {
        filter: blur(12px);
      }

      /* Keep the card itself crisp so the page still looks normal */
      body.disguise-mode .card {
        overflow: hidden;
      }

      /* Replace the page heading */
      body.disguise-mode #page-title,
      body.disguise-mode #page-subtitle {
        font-size: 0;
      }

      body.disguise-mode #page-title::after {
        content: "Daily Inspiration";
        font-size: clamp(32px, 5vw, 58px);
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      body.disguise-mode #page-subtitle::after {
        content: "A collection of thoughts.";
        font-size: 14px;
        opacity: 0.55;
      }

      /* Make the disguise button very subtle */
      body.disguise-mode .disguise-toggle {
        opacity: 0.15;
      }
    </style>
  </head>
  <body>
	  <div class="audio-modal" id="audio-modal">
  <div class="audio-modal-box">
    <div class="audio-modal-title">Ready?</div>
    <div class="audio-modal-text">
      Your gallery is waiting.
    </div>

    <button id="enter-gallery">
      Enter Gallery
    </button>
  </div>
</div>
    <header>
      <div class="eyebrow">My reality</div>
      <h1 id="page-title">Manifestation Gallery</h1>
      <div class="subtitle" id="page-subtitle">What I already have.</div>
      <button class="disguise-toggle" id="disguise-toggle" aria-label="Toggle disguise mode" title="Toggle disguise mode"> ••• </button>
    </header>
    <main class="gallery" id="gallery"></main>
    <div class="footer"> Everything is working out in my favour. </div>
    <script>
      let manifestations = [];
		const pageFlipSound = new Audio("sounds/page-flip.mp3");
	pageFlipSound.volume = 0.35;

      function shuffle(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text ?? "";
        return div.innerHTML;
      }

      function createCard(item) {
        const card = document.createElement("article");
        const image = Array.isArray(item.images) && item.images.length ? item.images[0] : null;
        card.className = image ? "card image-card" : "card text-card";
        if (image) {
          card.innerHTML = `


















					<div class="image-wrapper">
						<img
    class="card-image card-image-blur"
    src="${escapeHTML(image)}"
    alt=""
    aria-hidden="true"
  >
							<img
    class="card-image card-image-sharp"
    src="${escapeHTML(image)}"
    alt=""
  >
							</div>
							<div class="card-content">
								<div class="card-title">



${escapeHTML(item.title)}



</div>





${



item.tag



? `



















								<div class="card-tag">



${escapeHTML(item.tag)}



</div>`



: ""



}




















							</div>



`;
        } else {
          card.innerHTML = `




















							<div class="card-content">
								<div class="card-title">



${escapeHTML(item.title)}



</div>





${



item.tag



? `



















								<div class="card-tag">



${escapeHTML(item.tag)}



</div>`



: ""



}




















							</div>



`;
        }
        return card;
      }

      function renderGallery() {
        const gallery = document.getElementById("gallery");
        if (!gallery) {
          console.error("Gallery element not found.");
          return;
        }
        gallery.innerHTML = "";
        if (manifestations.length === 0) {
          gallery.innerHTML = `




















							<div class="card text-card">
								<div class="card-content">
									<div class="card-title">



No manifestations found.



</div>
								</div>
							</div>



`;
          return;
        }
        // Randomly select up to 10 manifestations.
        const selected = shuffle(manifestations).slice(0, 10);
        selected.forEach(item => {
          gallery.appendChild(createCard(item));
        });

		  pageFlipSound.currentTime = 0;

pageFlipSound.play().catch(() => {});
      }
      async function loadManifestations() {
        try {
          const response = await fetch("./data/manifestations.json", {
            cache: "no-store"
          });
          if (!response.ok) {
            throw new Error(`Could not load manifestations.json: HTTP ${response.status}`);
          }
          const data = await response.json();
          /*



          manifestations.json has this structure:





          {



          "manifestations": [...]



          }



          */
          if (!data || !Array.isArray(data.manifestations)) {
            throw new Error("manifestations.json does not contain a manifestations array.");
          }
          manifestations = data.manifestations;
          console.log(`Loaded ${manifestations.length} manifestations.`);
          renderGallery();
        } catch (error) {
          console.error(error);
          document.getElementById("gallery").innerHTML = `




















							<div class="card text-card">
								<div class="card-content">
									<div class="card-title">



Couldn't load the manifestations.



</div>
									<div class="card-tag">



Check the browser console



</div>
								</div>
							</div>



`;
        }
      }
      // Load the actual Notion data.
      loadManifestations();
      // Reshuffle every 5 minutes.
      setInterval(renderGallery, 5 * 60 * 1000);
      const disguiseToggle = document.getElementById("disguise-toggle");
      const pageTitle = document.getElementById("page-title");
      const pageSubtitle = document.getElementById("page-subtitle");

      function setDisguiseMode(enabled) {
        document.body.classList.toggle("disguise-mode", enabled);
        localStorage.setItem("disguiseMode", enabled ? "true" : "false");
      }

      function toggleDisguiseMode() {
        const enabled = !document.body.classList.contains("disguise-mode");
        setDisguiseMode(enabled);
      }
      disguiseToggle.addEventListener("click", toggleDisguiseMode);
      // Press D to toggle disguise mode.
      // Ignore the shortcut when typing into an input.
      document.addEventListener("keydown", event => {
        if (event.key.toLowerCase() === "d" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
          toggleDisguiseMode();
        }
      });
      // Remember the last mode used.
      const savedDisguiseMode = localStorage.getItem("disguiseMode");
      if (savedDisguiseMode === "true") {
        setDisguiseMode(true);
      }
    </script>
  </body>
</html>
